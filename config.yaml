# 服务配置
server:
  host: "0.0.0.0"
  port: 8000

# LLM配置（兼容 OpenAI SDK：api_key / base_url / model 可由 .env 覆盖）
llm:
  provider: "openai" # openai | baidu | aliyun
  model: "${OPENAI_MODEL}"
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"
  timeout: 120
  max_tokens: 2048
  cache_ttl_seconds: 3600
  json_response_format: false

# 解析层补充（不修改说明书 4.1 系统提示词；仅追加在用户消息末尾）
parser:
  database_default_time_column: started_at
  database_extra_hints: |
    recording 库：connection 必须为配置里存在的键名「recording」（MySQL 库名由 DATABASE_RECORDING_URL 决定，与表名无关）。
    存储「录音」数据的表名固定为 **recordings**（小写 + 结尾 s）。
    禁止使用不存在的表名：recording_data、recording_record、recordings_data 等；一律只用 **recordings**。
    查「前几条」若无排序要求可用：SELECT * FROM recordings LIMIT 3；
    若需按时间从新到旧：SELECT * FROM recordings ORDER BY started_at DESC LIMIT 3（时间列以表中真实字段为准，可为 started_at 或 created_at）。
    若用户要「用户表 / users 表 / user 账号数据」（不是录音内容）：必须用 **FROM users**，不得因「recording 库」就误用 recordings；只有「录音/录音数据」才用 recordings。

# 数据库连接（只读账号）— 生产环境建议改为环境变量占位
# 本地联调可加 sqlite（需 LLM 解析出 connection 名一致），例如：
#   local_sqlite:
#     url: "sqlite:////tmp/openclaw_local.db"
#     max_rows: 10
#     timeout: 5
database:
  recording:
    url: "${DATABASE_RECORDING_URL}"
    max_rows: 10
    timeout: 5
  log_db:
    url: "mysql+pymysql://readonly:pass@log.internal:3306/logs"
    max_rows: 10
    timeout: 5
  dream:
    url: "${DATABASE_DREAM_URL}"
    max_rows: 10
    timeout: 5

# 模型偶发使用非配置名时的映射（键 -> config.database 下的真实连接名）
database_connection_aliases:
  default_db: main_db
  dream_db: dream
  recording_db: recording

# 文件路径白名单
file:
  allowed_paths:
    - "/var/log"
    - "/data/logs"
    - "/tmp"
  max_lines: 100

# API白名单
api:
  whitelist:
    - "api.internal.com"
    - "hook.example.com"
    - "api.github.com"
  timeout: 5

# 浏览器工具（Playwright）；外网文档类场景不限制域名，仅允许 http/https
browser:
  navigation_timeout_seconds: 30

# IM配置
im:
  feishu:
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"
    encrypt_key: "${FEISHU_ENCRYPT_KEY}"
    verification_token: "${FEISHU_VERIFICATION_TOKEN}"
  wechat:
    corp_id: "${WECHAT_CORP_ID}"
    secret: "${WECHAT_SECRET}"
    agent_id: "${WECHAT_AGENT_ID}"
    callback_token: "${WECHAT_CALLBACK_TOKEN}"

# =============================================================================
# 项目排期及进度汇总（对齐需求文档：目标用户四类场景 + IM 机器人 + 后端）
# 字段：需求 | 功能点 | 子功能 | 人员 | 时间 | 时长 | 进度（已完成/进行中/未开始）
# =============================================================================
project_schedule:
  meta:
    依据: "产品定位（运维/开发/测试/数据）；形态飞书与企业微信 IM + OpenClaw Lite 后端"
    备注: "时长为人日估算；时间为相对迭代周次，可按立项日整体平移"
    更新: "2026-05-15"
  items:
    # ---------- 里程碑 / 底座 ----------
    - 需求: "里程碑"
      功能点: "MVP 可演示"
      子功能:
        - "IM 文本进线 → LLM 解析 → 白名单工具执行 → IM 文本回贴（飞书闭环）"
        - "对内环境可联调数据库 / 只读日志 / 白名单 HTTP / 浏览器拉文档"
      人员: "全栈/后端牵头 + 运维协助鉴权"
      时间: "第 4 周末"
      时长: "-"
      进度: "进行中"

    - 需求: "基础设施"
      功能点: "后端服务与配置"
      子功能:
        - "FastAPI 应用、生命周期加载 LLM 与配置"
        - "POST /execute 统一执行入口与健康检查"
        - "YAML + 环境变量占位、多库连接与解析层提示（parser 后缀）"
      人员: "后端"
      时间: "第 1 周"
      时长: "4"
      进度: "已完成"

    - 需求: "基础设施"
      功能点: "可观测性与发布"
      子功能:
        - "结构化日志（user、platform、tool、耗时、错误码）"
        - "Metrics/Tracing 对接（Prometheus/OpenTelemetry 择一）"
        - "容器化与灰度发布说明、配置分环境"
      人员: "后端 + 运维"
      时间: "第 5–6 周"
      时长: "5"
      进度: "未开始"

    # ---------- 核心：命令行聊天化 ----------
    - 需求: "解析与编排"
      功能点: "自然语言 → 结构化工具调用"
      子功能:
        - "基于说明书的 LLM 解析（tool + 参数 JSON）"
        - "解析失败与逾界参数的可读错误反馈"
        - "多轮上下文（可选：引用前一条任务 id / 会话窗口）"
      人员: "后端"
      时间: "第 1–2 周"
      时长: "6"
      进度: "进行中"

    - 需求: "工具链"
      功能点: "数据库只读查询"
      子功能:
        - "多 connection、行数上限、超时、别名映射"
        - "业务表提示（如 recordings/users）降低误解析"
        - "危险语句拦截与 EXPLAIN 可选（按需）"
      人员: "后端 + 数据"
      时间: "第 2 周"
      时长: "4"
      进度: "已完成"

    - 需求: "工具链"
      功能点: "白名单 HTTP API 调用"
      子功能:
        - "域名白名单、超时、方法/Body 支持"
        - "与内部网关凭证注入方式（Header/服务账号）评审"
      人员: "后端"
      时间: "第 2–3 周"
      时长: "3"
      进度: "已完成"

    - 需求: "工具链"
      功能点: "受控读文件（日志 tail）"
      子功能:
        - "路径白名单、最大行数"
        - "大文件分块与关键字过滤（按需）"
      人员: "后端"
      时间: "第 3 周"
      时长: "2"
      进度: "已完成"

    - 需求: "工具链"
      功能点: "浏览器取文档（Playwright）"
      子功能:
        - "内网文档站只读抓取、导航超时配置"
        - "敏感站点的二次确认或额外白名单（按需）"
      人员: "后端"
      时间: "第 3 周"
      时长: "3"
      进度: "已完成"

    - 需求: "工具链"
      功能点: "监控/日志平台适配层（面向运维）"
      子功能:
        - "封装常见查询：按服务/关键字/时间窗查日志（对接现有平台 API 或跳转 deep link）"
        - "告警事件查询、SLO 看板快捷指令（与公司平台对齐）"
      人员: "后端 + 运维"
      时间: "第 4–5 周"
      时长: "6"
      进度: "未开始"

    # ---------- IM ----------
    - 需求: "IM 集成"
      功能点: "飞书机器人"
      子功能:
        - "事件订阅：URL 验证、encrypt_key 解密、Verification Token"
        - "im.message.receive_v1 文本解析、去 @、异步回复（发消息 API）"
        - "卡片/富文本与线程回复（按需二期）"
      人员: "后端"
      时间: "第 2–3 周"
      时长: "5"
      进度: "进行中"

    - 需求: "IM 集成"
      功能点: "企业微信应用消息"
      子功能:
        - "回调 URL 验证与 AES 加解密完整实现"
        - "主动发消息 API、access_token 缓存"
        - "与飞书对齐的统一 ExecuteRequest 语义"
      人员: "后端"
      时间: "第 4–5 周"
      时长: "6"
      进度: "未开始"

    - 需求: "IM 体验"
      功能点: "回复格式与风控"
      子功能:
        - "长文本截断与分段发送、链接预览控制"
        - "频率限制、单用户并发、敏感指令审计日志"
      人员: "后端"
      时间: "第 5 周"
      时长: "3"
      进度: "未开始"

    # ---------- 按角色场景拆解 ----------
    - 需求: "运维场景"
      功能点: "查日志 / 看监控"
      子功能:
        - "日志 tail +（可选）日志平台查询适配"
        - "常用仪表盘跳转或指标查询封装（取决于现有监控系统）"
      人员: "后端 + 运维"
      时间: "第 4–6 周"
      时长: "6"
      进度: "部分达成（文件日志）；监控适配未开始"

    - 需求: "运维场景"
      功能点: "调 API"
      子功能:
        - "重启/扩容类接口默认禁止或双人复核流程（治理评审）"
        - "只读与健康检查类接口优先接入白名单"
      人员: "后端 + 运维"
      时间: "第 3–5 周"
      时长: "4"
      进度: "进行中"

    - 需求: "开发场景"
      功能点: "查数据"
      子功能:
        - "跨库连接配置、查询模板（常用报表一键语句）"
      人员: "后端 + 开发代表"
      时间: "第 2–4 周"
      时长: "3"
      进度: "进行中"

    - 需求: "开发场景"
      功能点: "验接口 / 看文档"
      子功能:
        - "HTTP 工具覆盖 GET/POST + JSON Body"
        - "浏览器工具拉取 Swagger/内部 Wiki（域名治理）"
      人员: "后端"
      时间: "第 3–4 周"
      时长: "4"
      进度: "进行中"

    - 需求: "测试场景"
      功能点: "造数据 / 查状态 / 验结果"
      子功能:
        - "测试环境专用连接与开关（禁止指向生产）"
        - "固定数据剧本（seed SQL）由平台保管，机器人侧仅触发（按需）"
        - "流水线状态查询（对接 CI/CD OpenAPI）"
      人员: "后端 + 测试"
      时间: "第 5–7 周"
      时长: "7"
      进度: "未开始"

    - 需求: "数据团队场景"
      功能点: "跑 SQL / 导数据 / 看指标"
      子功能:
        - "结果集导出（CSV 上传到对象存储或 IM 文件）与体积上限"
        - "指标语义层对接（Metric API 或 BI 链接）"
      人员: "后端 + 数据"
      时间: "第 6–8 周"
      时长: "8"
      进度: "未开始"

    # ---------- 安全与赋能 ----------
    - 需求: "安全合规"
      功能点: "权限与审计"
      子功能:
        - "IM 用户与企业账号映射、最小权限 RBAC（按角色开放工具）"
        - "全链路审计：谁在何时查了哪张表/哪个域名"
        - "密钥与 Token 不落日志、轮换流程"
      人员: "后端 + 安全"
      时间: "第 5–7 周"
      时长: "8"
      进度: "未开始"

    - 需求: "赋能落地"
      功能点: "文档与培训"
      子功能:
        - "对内说明书：支持的句式示例、禁区、排障"
        - "各角色「十分钟上手」工作坊"
      人员: "产品/牵头人 + 各角色代表"
      时间: "第 7–8 周"
      时长: "4"
      进度: "未开始"

    - 需求: "质量保障"
      功能点: "自动化测试"
      子功能:
        - "解析层单测、工具单测、IM 回调签名校验集成测试"
        - "混沌：超时/大结果/恶意 URL 的压力用例"
      人员: "后端 + 测试"
      时间: "第 6–8 周"
      时长: "6"
      进度: "未开始"

  progress_snapshot:
    合计人日估算: "约 92（可按裁剪范围调整）"
    当前仓库对齐说明:
      - "已实现：FastAPI、/execute 流水线、database/api/file/browser 工具、飞书回调骨架与企业微信占位"
      - "进行中：飞书异步回复链路打磨、解析准确率与运维场景加深"
      - "待办：企业微信加解密与主动回复、监控适配、导出与 RBAC、体系化测试"


