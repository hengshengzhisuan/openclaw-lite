# 服务配置
server:
  host: "0.0.0.0"
  port: 8000
  open_chat_on_startup: false
  chat_user_id: "local_user"

# LLM配置（兼容 OpenAI SDK：api_key / base_url / model 可由 .env 覆盖）
llm:
  provider: "openai" # openai | baidu | aliyun
  model: "${OPENAI_MODEL}"
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"
  timeout: 120
  max_tokens: 2048
  cache_ttl_seconds: 3600
  json_response_format: false

# 解析层补充（不修改说明书 4.1 系统提示词；仅追加在用户消息末尾）
parser:
  database_default_time_column: started_at
  database_extra_hints: |
    recording 库：connection 必须为配置里存在的键名「recording」（MySQL 库名由 DATABASE_RECORDING_URL 决定，与表名无关）。
    **用户数据**（用户表 / users / 用户信息 / 项目用户 / 账号数据）：表名固定为 **users**，示例：SELECT * FROM users LIMIT 3。
    「录音笔」是产品/项目名；含「用户数据」时一律查 **users**，不得因出现 recording/录音笔 就查 recordings。
    **录音数据**（录音内容/录音记录，非用户账号）：表名固定为 **recordings**（小写 + 结尾 s）。
    禁止使用不存在的表名：recording_data、recording_record、recordings_data 等。
    查录音「前几条」若无排序：SELECT * FROM recordings LIMIT 3；
    按时间从新到旧：SELECT * FROM recordings ORDER BY started_at DESC LIMIT 3。

# 数据库连接（只读账号）— 生产环境建议改为环境变量占位
# 本地联调可加 sqlite（需 LLM 解析出 connection 名一致），例如：
#   local_sqlite:
#     url: "sqlite:////tmp/openclaw_local.db"
#     max_rows: 10
#     timeout: 5
database:
  recording:
    url: "${DATABASE_RECORDING_URL}"
    max_rows: 10
    timeout: 5
  log_db:
    url: "mysql+pymysql://readonly:pass@log.internal:3306/logs"
    max_rows: 10
    timeout: 5
  dream:
    url: "${DATABASE_DREAM_URL}"
    max_rows: 10
    timeout: 5

# 模型偶发使用非配置名时的映射（键 -> config.database 下的真实连接名）
database_connection_aliases:
  default_db: recording
  main_db: recording
  dream_db: dream
  recording_db: recording

# 文件路径白名单
file:
  allowed_paths:
    - "/var/log"
    - "/data/logs"
    - "/tmp"
  max_lines: 100

# API白名单
api:
  whitelist:
    - "api.internal.com"
    - "hook.example.com"
    - "api.github.com"
  timeout: 5

# 浏览器工具（Playwright）；外网文档类场景不限制域名，仅允许 http/https
browser:
  navigation_timeout_seconds: 30

# 天气查询（Open-Meteo，无需 API Key）
weather:
  default_city: "北京"
  timeout: 10

# IM配置
im:
  feishu:
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"
    encrypt_key: "${FEISHU_ENCRYPT_KEY}"
    verification_token: "${FEISHU_VERIFICATION_TOKEN}"
  wechat:
    corp_id: "${WECHAT_CORP_ID}"
    secret: "${WECHAT_SECRET}"
    agent_id: "${WECHAT_AGENT_ID}"
    callback_token: "${WECHAT_CALLBACK_TOKEN}"
    encoding_aes_key: "${WECHAT_ENCODING_AES_KEY}"
