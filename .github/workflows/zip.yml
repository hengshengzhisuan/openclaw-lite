# 与 main.yml 相同（保留此文件名以兼容 README 中的历史链接）
name: release-amd64-image-zip

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: "制品版本号，如 v1.0.0-rc1；留空则用 dev-<短 SHA>"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-amd64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: openclaw-lite

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version & artifact name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.version_label }}" ]]; then
            VERSION="${{ github.event.inputs.version_label }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          SAFE_VERSION="${VERSION//\//-}"
          ARTIFACT="${IMAGE_NAME}_${SAFE_VERSION}_linux_amd64.tar.gz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image as tar.gz
        shell: bash
        run: |
          set -euo pipefail
          docker save "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" | gzip -c > "${{ steps.meta.outputs.artifact }}"

      - name: Upload workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ steps.meta.outputs.safe_version }}
          path: ${{ steps.meta.outputs.artifact }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.artifact }}
